<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anniversary Sign Photo</title>
<style>
:root{--pink:#f4a7bb;--bg:#15101a;--fg:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;overflow:hidden}
#app{display:flex;height:100%;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;background:#000;overflow:hidden;border-radius:10px;flex:none}
video,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#shot{display:none}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;text-shadow:0 1px 3px #000}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#000c;font-size:15px;line-height:1.6}
#side{display:flex;flex-direction:column;gap:14px;align-items:center;width:96px;flex:none}
button,a.btn{border:0;border-radius:999px;background:#ffffff22;color:var(--fg);font-size:13px;padding:10px 12px;width:100%;text-align:center;text-decoration:none;cursor:pointer}
button.main{background:var(--pink);color:#3a1020;font-weight:700}
#shutter{width:72px;height:72px;padding:0;border:4px solid #fff;background:var(--pink)}
.review{display:none}
body.review .live{display:none}
body.review .review{display:block}
body.review #shot{display:block}
#rotate{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;line-height:1.7;z-index:9}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate">Please rotate your phone to landscape<br>and turn off screen rotation lock</div>
<div id="app">
  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <img id="shot" alt="">
    <svg id="guide" viewBox="0 0 800 600" preserveAspectRatio="none">
      <g fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 9" style="filter:drop-shadow(0 0 3px #000)">
        <rect x="258" y="60" width="284" height="402" rx="4"/>
        <path d="M110 600 C125 505 215 470 300 462 M500 462 C585 470 675 505 690 600"/>
      </g>
      <text x="400" y="270" fill="#fff" fill-opacity=".8" font-size="22" text-anchor="middle" style="paint-order:stroke;stroke:#000;stroke-width:4">A4 sign</text>
    </svg>
    <div id="hint">Fit your sign inside the frame and face the light</div>
    <div id="msg"></div>
  </div>
  <div id="side">
    <button id="flip" class="live">🔄 Flip camera</button>
    <button id="shutter" class="live" aria-label="Take photo"></button>
    <button id="save" class="main review">Save photo</button>
    <button id="retake" class="review">Retake</button>
    <a id="up" class="btn review" target="_blank" rel="noopener" style="display:none">Go to upload</a>
  </div>
</div>
<script>
// ===== ตั้งค่า =====
const UPLOAD_URL = "";      // ใส่ลิงก์ที่ให้อัปโหลด (เช่น Google Form / โฟลเดอร์) ถ้าเว้นว่างจะไม่แสดงปุ่ม
const OUT_W = 800, OUT_H = 600; // ขนาดไฟล์ 4:3
// ====================
const $ = id => document.getElementById(id);
const v = $('v'), stage = $('stage'), msg = $('msg');
let facing = 'environment', stream = null, blob = null;

function size(){
  const aw = innerWidth - 96 - 12 - 24, ah = innerHeight - 16;
  const w = Math.min(aw, ah * 4/3);
  stage.style.width = w + 'px'; stage.style.height = (w * 3/4) + 'px';
}
addEventListener('resize', size); size();

function say(t){ msg.innerHTML = t; msg.style.display = t ? 'flex' : 'none'; }

async function start(){
  say('');
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (/Line\/|FBAN|FBAV|Instagram|Twitter/i.test(navigator.userAgent))
    say('If the camera does not start, please open this link in Safari or Chrome<br>(in-app browsers often block camera access)');
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    v.srcObject = stream; await v.play();
    v.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none'; // พรีวิวกลับด้านเฉพาะกล้องหน้า
    say('');
  }catch(e){
    say('Could not open the camera<br>Please allow camera access in your browser<br>and open this page over https');
  }
}

$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };

$('shutter').onclick = () => {
  if (!v.videoWidth) return;
  const vw = v.videoWidth, vh = v.videoHeight;
  let sw, sh;
  if (vw / vh > 4/3){ sh = vh; sw = vh * 4/3; } else { sw = vw; sh = vw * 3/4; }
  const c = document.createElement('canvas'); c.width = OUT_W; c.height = OUT_H;
  c.getContext('2d').drawImage(v, (vw - sw)/2, (vh - sh)/2, sw, sh, 0, 0, OUT_W, OUT_H); // บันทึกภาพปกติ ไม่กลับด้าน
  c.toBlob(b => {
    blob = b;
    $('shot').src = URL.createObjectURL(b);
    document.body.classList.add('review');
    $('guide').style.display = 'none'; $('hint').style.display = 'none';
  }, 'image/jpeg', 0.9);
};

$('retake').onclick = () => {
  document.body.classList.remove('review');
  $('guide').style.display = ''; $('hint').style.display = '';
};

$('save').onclick = async () => {
  if (!blob) return;
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `photo-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  const file = new File([blob], name, {type:'image/jpeg'});
  try{
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});   // มือถือ: เลือก "บันทึกรูปภาพ" ได้จากเมนูแชร์
    } else { throw new Error('fallback'); }
  }catch(e){
    if (e.name === 'AbortError') return;
    const a = document.createElement('a');       // สำรอง: ดาวน์โหลดไฟล์
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
  }
  if (UPLOAD_URL){ $('up').href = UPLOAD_URL; $('up').style.display = 'block'; }
};

start();
</script>
</body>
</html>
